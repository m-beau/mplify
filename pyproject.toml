[project]
name = "mplify"
version = "1.0.2"
description = "MatPlotLib Prettifier - make plots pretty with a single function call"
readme = "README.md"
authors = [
    { name = "m-beau", email = "maximebeaujeanroch047@gmail.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["matplotlib", "plotting", "visualization", "figures", "science"]
# The Python :: X.Y classifiers are what PyPI (and the shields.io pyversions
# badge) read — requires-python alone is not enough for either.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: Matplotlib",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "matplotlib",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/m-beau/mplify"
Issues = "https://github.com/m-beau/mplify/issues"

[dependency-groups]
# Only needed to run quickstart.ipynb and to use html_palette()'s inline
# preview — mplify itself imports IPython lazily, so it is not a runtime dep.
dev = [
    "ipykernel>=7.3.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# E701: multiple statements on one line (colon) — mplify relies on compact
# `if x is None: x = default` one-liners throughout for default-resolution,
# so this is disabled repo-wide rather than reformatted or noqa'd per line.
ignore = ["E701"]
